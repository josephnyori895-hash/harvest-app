# coturn.conf — VPS TURN for 60% Nyeri 3G NAT (symmetric NAT)
# Fits KES 1k VPS: coturn on same host, host networking, 3478/5349
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
relay-ip=0.0.0.0
external-ip=${COTURN_EXTERNAL_IP:-AUTO}
fingerprint
lt-cred-mech
realm=harvestfamily.or.ke
user=harvest:${COTURN_PASSWORD:-replace-me-32chars}
# Nyeri 3G: long-lifetime, keepalives
stale-nonce=0
no-multicast-peers
no-cli
verbose
# Hardened for church routers / mobile restrictive NAT (symmetric, double NAT)
keep-address-mapping
no-tcp-relay
no-tcp-relay
# relay threads for 20 concurrent calls
relay-threads=4
# extra verbose for ICE debug behind church firewall
# no-rfc5780 disabled to allow classic NAT discovery
# bandwidth for 500 users — 20 concurrent calls cap
max-bps=30000000
bps-capacity=0
# certs (Caddy or certbot mounts to /etc/coturn/certs/)
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem
# For TLS TURN (turns:5349) needed on mobile NAT; plain turn:3478 fallback
