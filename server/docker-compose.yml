services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: harvest
      POSTGRES_USER: harvest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    ports: ["127.0.0.1:5432:5432"]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U harvest -d harvest"], interval: 10s, retries: 5, timeout: 5s }
    deploy: { resources: { limits: { memory: 400M } } }

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes: [minio_data:/data]
    ports: ["127.0.0.1:9001:9001"]
    expose: ["9000"]
    healthcheck: { test: ["CMD","curl","-f","http://localhost:9000/minio/health/live"], interval: 15s, retries: 5 }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck: { test: ["CMD-SHELL","redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"], interval: 10s, retries: 5 }
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    deploy: { resources: { limits: { memory: 80M } } }

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://harvest:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/harvest
      DATABASE_SSL: "false"
      DB_POOL_MAX: 20
      DB_CONNECTION_TIMEOUT_MS: 10000
      DB_IDLE_TIMEOUT_MS: 30000
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: harvest-media
      MINIO_USE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MEDIA_URL_SECRET: ${MEDIA_URL_SECRET:-${JWT_SECRET}}
      ADMIN_PIN_HASHES: ${ADMIN_PIN_HASHES:?ADMIN_PIN_HASHES is required}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      COTURN_URL: turns:${COTURN_HOST:?COTURN_HOST is required}:5349
      COTURN_HOST: ${COTURN_HOST:?COTURN_HOST is required}
      PORT: 3000
      NODE_ENV: production
    expose: ["3000"]
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: { test: ["CMD","wget","-qO-","http://localhost:3000/health"], interval: 15s, retries: 5 }
    deploy: { resources: { limits: { memory: 350M } } }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80","443:443","443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, minio]
    healthcheck: { test: ["CMD","wget","-qO-","http://localhost:80/health"], interval: 30s, retries: 3 }

  coturn:
    image: coturn/coturn:alpine
    restart: unless-stopped
    network_mode: host
    volumes: ["./coturn.conf:/etc/coturn/turnserver.conf:ro"]
    command: -c /etc/coturn/turnserver.conf

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required when tunnel profile is enabled}
    profiles: ["tunnel"]
    depends_on: [caddy]
    network_mode: host

volumes:
  pgdata:
  minio_data:
  caddy_data:
  caddy_config:
