[build]
  command = "npm install --prefix server && npm run build"
  publish = "dist"

[functions]
  directory = "server/netlify/functions"
  # nft (Node file trace) runs the ESM sources natively; esbuild's ESM shim
  # double-declares __dirname and crashes the api function at boot.
  node_bundler = "nft"
  external_node_modules = ["sharp", "@netlify/database"]

[build.environment]
  NODE_VERSION = "22"

# Route API requests to the Fastify Netlify Function before the SPA fallback.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true
