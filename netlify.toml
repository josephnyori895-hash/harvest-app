[build]
  command = "npm run build && npm install --prefix server --omit=dev && npm run migrate --prefix server"
  publish = "dist"

[functions]
  directory = "server/netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
