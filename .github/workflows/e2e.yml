name: frontend-backend-e2e

on:
  workflow_dispatch:

jobs:
  group-chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium

      - name: Install frontend dependencies
        run: npm ci

      - name: Run group/chat frontend-backend E2E
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_API_URL: ${{ secrets.E2E_API_URL }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PIN: ${{ secrets.E2E_PIN }}
          E2E_GROUP_SLUG: ${{ secrets.E2E_GROUP_SLUG }}
          E2E_CHROME_PATH: /usr/bin/chromium
        run: npm run test:e2e:group-chat
