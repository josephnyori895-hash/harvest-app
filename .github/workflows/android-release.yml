name: Harvest Android APK Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: harvest-android-release
  cancel-in-progress: false

env:
  API_BASE_URL: https://harvestfamily-api.harvestfamily.workers.dev

jobs:
  source-integrity:
    name: "01 Source integrity"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check

  release-preflight:
    name: "02 Release preflight"
    needs: source-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run validate:release

  frontend-quality:
    name: "03 Frontend quality"
    needs: release-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:all

  security-audit:
    name: "04 Security audit"
    needs: frontend-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm audit --audit-level=high

  production-build:
    name: "05 Production build"
    needs: security-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: echo "VITE_API_URL=$API_BASE_URL" >> "$GITHUB_ENV" && npm run build
      - run: test -s dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: harvest-web-${{ github.run_number }}
          path: dist
          retention-days: 14

  android-prepare:
    name: "06 Android prepare"
    needs: production-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: harvest-web-${{ github.run_number }}, path: dist}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21", cache: gradle}
      - run: npm ci
      - run: npx cap sync android
      - uses: actions/upload-artifact@v4
        with:
          name: harvest-android-${{ github.run_number }}
          path: android
          retention-days: 14

  signed-apk:
    name: "07 Signed APK"
    needs: android-prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: harvest-android-${{ github.run_number }}, path: .}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21", cache: gradle}
      - name: Restore keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf "%s" "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/harvest-release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android/harvest-release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Verify signed APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: harvest-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

  apk-fingerprint:
    name: "08 APK fingerprint"
    needs: signed-apk
    runs-on: ubuntu-latest
    outputs:
      filename: ${{ steps.fp.outputs.filename }}
      sha: ${{ steps.fp.outputs.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: harvest-apk-${{ github.run_number }}, path: apk}
      - id: fp
        run: |
          SHA="$(sha256sum apk/app-release.apk | cut -d" " -f1)"
          NAME="harvest-family-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}.apk"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "filename=$NAME" >> "$GITHUB_OUTPUT"
          echo "$SHA  $NAME" > fingerprint.txt
      - uses: actions/upload-artifact@v4
        with: {name: harvest-fingerprint-${{ github.run_number }}, path: fingerprint.txt, retention-days: 14}

  deploy-production:
    name: "09 Deploy production"
    needs: apk-fingerprint
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://harvestfamily-api.harvestfamily.workers.dev/health
    outputs:
      filename: ${{ needs.apk-fingerprint.outputs.filename }}
      sha: ${{ needs.apk-fingerprint.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: harvest-web-${{ github.run_number }}, path: dist}
      - uses: actions/download-artifact@v4
        with: {name: harvest-apk-${{ github.run_number }}, path: apk}
      - run: npm ci --prefix workers
      - name: Stage exact APK and web assets
        env: {GITHUB_TOKEN: ${{ github.token }}}
        run: |
          set -euo pipefail
          rm -rf workers/public
          mkdir -p workers/public workers/downloads
          cp -r dist/. workers/public/
          cp apk/app-release.apk workers/public/harvest-family.apk
          cp apk/app-release.apk workers/public/${{ needs.apk-fingerprint.outputs.filename }}
          cp apk/app-release.apk workers/downloads/${{ needs.apk-fingerprint.outputs.filename }}

          # Preserve the previous verified APK in the same deployment so the rollback gate can exercise a real rollback.
          RUNS_JSON="$(curl --fail --silent --show-error -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?branch=main&status=success&per_page=20")"
          PREVIOUS="$(printf "%s" "$RUNS_JSON" | jq -r --arg workflow "Harvest Android APK Release" --argjson current "$GITHUB_RUN_NUMBER" "[.workflow_runs[] | select(.name == $workflow and .run_number < $current) | {run_number,id,head_sha}] | sort_by(.run_number) | last | [.run_number,.id,.head_sha] | @tsv")"
          if [ -n "$PREVIOUS" ] && [ "$PREVIOUS" != "null" ]; then
            PRUN="$(printf "%s" "$PREVIOUS" | cut -f1)"; PID="$(printf "%s" "$PREVIOUS" | cut -f2)"; PSHA="$(printf "%s" "$PREVIOUS" | cut -f3)"
            PNAME="harvest-family-${PRUN}-${PSHA:0:7}.apk"
            AID="$(curl --fail --silent --show-error -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$PID/artifacts" | jq -r --arg n1 "harvest-apk-$PRUN" --arg n2 "harvest-family-apk-$PRUN" ".artifacts[] | select((.name == $n1 or .name == $n2) and .expired == false) | .id" | head -n1)"
            if [ -n "$AID" ] && [ "$AID" != "null" ]; then
              ZIP="$(mktemp)"
              curl --fail --silent --show-error --location -H "Authorization: Bearer $GITHUB_TOKEN" -o "$ZIP" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$AID/zip"
              unzip -p "$ZIP" "*.apk" > "workers/public/$PNAME"
              rm -f "$ZIP"
              echo "Previous verified APK staged: $PNAME"
            fi
          fi
          test -s workers/public/harvest-family.apk
      - name: Apply D1 migrations
        working-directory: workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_PIN_HASHES: ${{ secrets.ADMIN_PIN_HASHES }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"; test -n "$CLOUDFLARE_API_TOKEN"; test -n "$ADMIN_PIN_HASHES"
          npx wrangler d1 migrations apply DB --remote
      - name: Deploy exact release
        working-directory: workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_PIN_HASHES: ${{ secrets.ADMIN_PIN_HASHES }}
        run: npx wrangler deploy --var "RELEASE_APK_FILENAME:${{ needs.apk-fingerprint.outputs.filename }}"

  production-smoke:
    name: "10 Production smoke"
    needs: deploy-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - env:
          SMOKE_BASE_URL: https://harvestfamily-api.harvestfamily.workers.dev
          SMOKE_USERNAME: ${{ secrets.E2E_USERNAME }}
          SMOKE_PIN: ${{ secrets.E2E_PIN }}
        run: npm run smoke

  browser-e2e:
    name: "11 Browser E2E"
    needs: production-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: ImageAdjuster E2E
        env:
          E2E_BASE_URL: https://harvestfamily-api.harvestfamily.workers.dev
          E2E_API_URL: https://harvestfamily-api.harvestfamily.workers.dev
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PIN: ${{ secrets.E2E_PIN }}
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          E2E_CHROME_PATH="$CHROME_PATH" npm run test:e2e:image-adjuster

  verify-versioned-apk:
    name: "12 Verify versioned APK"
    needs: [deploy-production, browser-e2e]
    runs-on: ubuntu-latest
    steps:
      - env:
          URL: https://harvestfamily-api.harvestfamily.workers.dev/${{ needs.deploy-production.outputs.filename }}
          EXPECTED: ${{ needs.deploy-production.outputs.sha }}
        run: |
          set -euo pipefail
          B="$(mktemp)"; trap "rm -f $B" EXIT
          for i in {1..10}; do
            STATUS="$(curl --silent --show-error --location --max-time 120 --write-out "%{http_code}" -o "$B" "$URL" || true)"
            [ "$STATUS" = 200 ] && [ "$(sha256sum "$B" | cut -d" " -f1)" = "$EXPECTED" ] && exit 0
            sleep 15
          done
          echo "::error::Versioned APK SHA mismatch or unavailable"; exit 1

  verify-permanent-apk:
    name: "13 Verify permanent APK"
    needs: [deploy-production, verify-versioned-apk]
    runs-on: ubuntu-latest
    steps:
      - env:
          URL: https://harvestfamily-api.harvestfamily.workers.dev/harvest-family.apk
          EXPECTED: ${{ needs.deploy-production.outputs.sha }}
          FILENAME: ${{ needs.deploy-production.outputs.filename }}
        run: |
          set -euo pipefail
          H="$(mktemp)"; B="$(mktemp)"; trap "rm -f $H $B" EXIT
          for i in {1..10}; do
            curl --silent --show-error --max-time 120 -D "$H" -o "$B" "$URL" || true
            CACHE="$(awk "BEGIN{IGNORECASE=1} /^Cache-Control:/ {sub(/^Cache-Control:[[:space:]]*/,""); sub(/\r$/,""); print; exit}" "$H")"
            DISP="$(awk "BEGIN{IGNORECASE=1} /^Content-Disposition:/ {sub(/^Content-Disposition:[[:space:]]*/,""); sub(/\r$/,""); print; exit}" "$H")"
            LIVE="$(sha256sum "$B" | cut -d" " -f1)"
            if grep -q "200" "$H" && [ "$CACHE" = "no-store, max-age=0" ] && [ "$DISP" = "attachment; filename=\"$FILENAME\"" ] && [ "$LIVE" = "$EXPECTED" ]; then exit 0; fi
            sleep 15
          done
          echo "::error::Permanent APK verification failed"; exit 1

  rollback-and-restore:
    name: "14 Rollback and restore"
    needs: [deploy-production, verify-permanent-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci --prefix workers
      - name: Verify previous release, rollback, and restore
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          CURRENT: ${{ needs.deploy-production.outputs.filename }}
          CURRENT_SHA: ${{ needs.deploy-production.outputs.sha }}
        working-directory: workers
        run: |
          set -euo pipefail
          RUNS="$(curl --fail --silent --show-error -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?branch=main&status=success&per_page=20")"
          PREV="$(printf "%s" "$RUNS" | jq -r --arg w "Harvest Android APK Release" --argjson c "$GITHUB_RUN_NUMBER" "[.workflow_runs[] | select(.name == $w and .run_number < $c) | {run_number,id,head_sha}] | sort_by(.run_number) | last | [.run_number,.id,.head_sha] | @tsv")"
          test -n "$PREV" && test "$PREV" != "null"
          PRUN="$(printf "%s" "$PREV" | cut -f1)"; PID="$(printf "%s" "$PREV" | cut -f2)"; PSHA="$(printf "%s" "$PREV" | cut -f3)"
          PNAME="harvest-family-${PRUN}-${PSHA:0:7}.apk"
          AID="$(curl --fail --silent --show-error -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$PID/artifacts" | jq -r --arg n "harvest-apk-$PRUN" ".artifacts[] | select(.name == $n and .expired == false) | .id" | head -n1)"
          test -n "$AID" && test "$AID" != "null"
          ZIP="$(mktemp)"; APK="$(mktemp)"; BODY="$(mktemp)"; trap "rm -f $ZIP $APK $BODY" EXIT
          curl --fail --silent --show-error --location -H "Authorization: Bearer $GITHUB_TOKEN" -o "$ZIP" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$AID/zip"
          unzip -p "$ZIP" "*.apk" > "$APK"; PREVSHA="$(sha256sum "$APK" | cut -d" " -f1)"
          npx wrangler deploy --var "RELEASE_APK_FILENAME:$PNAME"
          for i in {1..10}; do sleep 10; curl --silent --show-error -o "$BODY" "$API_BASE_URL/harvest-family.apk" || true; [ "$(sha256sum "$BODY" | cut -d" " -f1)" = "$PREVSHA" ] && break; done
          test "$(sha256sum "$BODY" | cut -d" " -f1)" = "$PREVSHA"
          npx wrangler deploy --var "RELEASE_APK_FILENAME:$CURRENT"
          for i in {1..10}; do sleep 10; curl --silent --show-error -o "$BODY" "$API_BASE_URL/harvest-family.apk" || true; [ "$(sha256sum "$BODY" | cut -d" " -f1)" = "$CURRENT_SHA" ] && break; done
          test "$(sha256sum "$BODY" | cut -d" " -f1)" = "$CURRENT_SHA"

  release:
    name: "RELEASED — all 14 gates passed"
    needs: [source-integrity, release-preflight, frontend-quality, security-audit, production-build, android-prepare, signed-apk, apk-fingerprint, deploy-production, production-smoke, browser-e2e, verify-versioned-apk, verify-permanent-apk, rollback-and-restore]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "HARVEST FAMILY APK RELEASED"
          echo "Commit: $GITHUB_SHA"
          echo "Run: #$GITHUB_RUN_NUMBER"
          echo "All 14 release gates passed."
