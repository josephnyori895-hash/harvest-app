name: Harvest Android APK Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: harvest-android-release
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://harvestfamily-api.harvestfamily.workers.dev/health
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure production API URL
        run: echo "VITE_API_URL=https://harvestfamily-api.harvestfamily.workers.dev" >> "$GITHUB_ENV"

      - name: Frontend release checks
        run: |
          npm run lint
          npm run typecheck
          npm run test:all
          npm audit --audit-level=high
          npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set Android version
        run: |
          echo "HARVEST_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "HARVEST_VERSION_NAME=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 is not configured"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::ANDROID_KEYSTORE_PASSWORD is not configured"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::ANDROID_KEY_ALIAS is not configured"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::ANDROID_KEY_PASSWORD is not configured"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/harvest-release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android/harvest-release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature and metadata
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          echo "APK SHA256:"
          sha256sum "$APK"
          echo "APK size:"
          stat -c '%s bytes' "$APK"

      - name: Stage versioned APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APK_FILENAME="harvest-family-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}.apk"
          APK_PATH="workers/downloads/$APK_FILENAME"
          cp "$APK" "$APK_PATH"
          test -s "$APK_PATH"
          LOCAL_SHA="$(sha256sum "$APK_PATH" | cut -d' ' -f1)"
          APK_SIZE="$(stat -c '%s' "$APK_PATH")"
          echo "APK_FILENAME=$APK_FILENAME" >> "$GITHUB_ENV"
          echo "LOCAL_SHA=$LOCAL_SHA" >> "$GITHUB_ENV"
          echo "APK_SIZE=$APK_SIZE" >> "$GITHUB_ENV"
          echo "Versioned APK: $APK_FILENAME"
          echo "LOCAL SHA256: $LOCAL_SHA"
          echo "APK size: $APK_SIZE bytes"

      - name: Install Worker dependencies
        run: npm ci --prefix workers

      - name: Apply D1 migrations
        working-directory: workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_PIN_HASHES: ${{ secrets.ADMIN_PIN_HASHES }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$ADMIN_PIN_HASHES" || { echo "::error::ADMIN_PIN_HASHES is required before applying the security migration"; exit 1; }
          npx wrangler d1 migrations apply DB --remote

      - name: Deploy Worker and versioned APK
        working-directory: workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_PIN_HASHES: ${{ secrets.ADMIN_PIN_HASHES }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$ADMIN_PIN_HASHES" || { echo "::error::ADMIN_PIN_HASHES is required"; exit 1; }
          test -n "$APK_FILENAME" || { echo "::error::APK_FILENAME is not set"; exit 1; }
          test -s "downloads/$APK_FILENAME" || { echo "::error::Versioned APK is missing"; exit 1; }
          npx wrangler deploy --var "RELEASE_APK_FILENAME:$APK_FILENAME"

      - name: Authenticated production smoke test
        env:
          SMOKE_BASE_URL: https://harvestfamily-api.harvestfamily.workers.dev
          SMOKE_USERNAME: ${{ secrets.E2E_USERNAME }}
          SMOKE_PIN: ${{ secrets.E2E_PIN }}
        run: npm run smoke

      - name: Verify exact versioned production APK
        env:
          APK_BASE_URL: https://harvestfamily-api.harvestfamily.workers.dev
        run: |
          set -euo pipefail
          VERSIONED_URL="$APK_BASE_URL/$APK_FILENAME"
          LIVE_SHA="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --max-time 120 "$VERSIONED_URL" | sha256sum | cut -d' ' -f1)"
          echo "LOCAL SHA256: $LOCAL_SHA"
          echo "LIVE SHA256:  $LIVE_SHA"
          test "$LOCAL_SHA" = "$LIVE_SHA"
          echo "Versioned production APK verified: $VERSIONED_URL"

      - name: Verify permanent download URL resolves to exact production APK
        env:
          APK_BASE_URL: https://harvestfamily-api.harvestfamily.workers.dev
        run: |
          set -euo pipefail
          PERMANENT_URL="$APK_BASE_URL/harvest-family.apk"
          HEADER_FILE="$(mktemp)"
          trap 'rm -f "$HEADER_FILE"' EXIT
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 120 -D "$HEADER_FILE" -o /dev/null "$PERMANENT_URL"
          STATUS_LINE="$(head -n 1 "$HEADER_FILE" | tr -d '\r' | sed 's/[[:space:]]*$//')"
          CACHE_CONTROL="$(awk 'BEGIN{IGNORECASE=1} /^Cache-Control:/ {sub(/^Cache-Control:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$HEADER_FILE")"
          CONTENT_DISPOSITION="$(awk 'BEGIN{IGNORECASE=1} /^Content-Disposition:/ {sub(/^Content-Disposition:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$HEADER_FILE")"
          echo "PERMANENT STATUS:      $STATUS_LINE"
          echo "PERMANENT CACHE:       $CACHE_CONTROL"
          echo "PERMANENT DISPOSITION: $CONTENT_DISPOSITION"
          case "$STATUS_LINE" in
            "HTTP/2 200"|"HTTP/1.1 200 OK") ;;
            *) echo "::error::Unexpected permanent URL status: $STATUS_LINE"; exit 1 ;;
          esac
          test "$CACHE_CONTROL" = "no-store, max-age=0"
          test "$CONTENT_DISPOSITION" = "attachment; filename=\"$APK_FILENAME\""
          LIVE_PERMANENT_SHA="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 120 "$PERMANENT_URL" | sha256sum | cut -d' ' -f1)"
          echo "LOCAL SHA256:          $LOCAL_SHA"
          echo "PERMANENT LIVE SHA256: $LIVE_PERMANENT_SHA"
          test "$LOCAL_SHA" = "$LIVE_PERMANENT_SHA"
          echo "Permanent APK URL verified: $PERMANENT_URL"
      - name: Verify permanent APK rollback to previous verified release
        working-directory: workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APK_BASE_URL: https://harvestfamily-api.harvestfamily.workers.dev
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }

          fetch_json() {
            # fetch_json <label> <url> [extra curl options...]
            local label="$1" url="$2"
            shift 2
            local output
            if ! output="$(curl --fail --silent --show-error --max-time 60 "$@" "$url")"; then
              echo "::error::$label request failed"
              exit 1
            fi
            printf '%s' "$output"
          }

          DEPLOYMENTS_JSON="$(fetch_json "Cloudflare deployments list" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/harvestfamily-api/deployments?per_page=10" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          CURRENT_VERSION_ID="$(printf '%s' "$DEPLOYMENTS_JSON" | jq -r '.result.deployments[0].versions[] | select(.percentage == 100) | .version_id' | head -n 1)"
          PREVIOUS_VERSION_ID="$(printf '%s' "$DEPLOYMENTS_JSON" | jq -r '.result.deployments[1].versions[] | select(.percentage == 100) | .version_id' | head -n 1)"
          test -n "$CURRENT_VERSION_ID" && test "$CURRENT_VERSION_ID" != "null" || { echo "::error::Unable to identify current Worker version"; exit 1; }
          test -n "$PREVIOUS_VERSION_ID" && test "$PREVIOUS_VERSION_ID" != "null" || { echo "::error::Unable to identify previous Worker version"; exit 1; }
          RUNS_JSON="$(fetch_json "GitHub Actions runs list" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?branch=main&status=success&per_page=20" -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GITHUB_TOKEN")"
          PREVIOUS_RELEASE="$(printf '%s' "$RUNS_JSON" | jq -r --arg workflow "Harvest Android APK Release" --argjson current "$GITHUB_RUN_NUMBER" '[.workflow_runs[] | select(.name == $workflow and .run_number < $current) | {run_number, head_sha}] | sort_by(.run_number) | last | [.run_number, .head_sha] | @tsv')"
          test -n "$PREVIOUS_RELEASE" && test "$PREVIOUS_RELEASE" != "null" || { echo "::error::No previous successful Android release found"; exit 1; }
          PREVIOUS_RUN="$(printf '%s' "$PREVIOUS_RELEASE" | cut -f1)"
          PREVIOUS_SHA_COMMIT="$(printf '%s' "$PREVIOUS_RELEASE" | cut -f2)"
          PREVIOUS_APK_FILENAME="harvest-family-${PREVIOUS_RUN}-${PREVIOUS_SHA_COMMIT:0:7}.apk"
          PREVIOUS_APK_URL="$APK_BASE_URL/$PREVIOUS_APK_FILENAME"
          PERMANENT_URL="$APK_BASE_URL/harvest-family.apk"
          echo "Current Worker version:  $CURRENT_VERSION_ID"
          echo "Previous Worker version: $PREVIOUS_VERSION_ID"
          echo "Previous verified run:   #$PREVIOUS_RUN"
          echo "Previous APK:            $PREVIOUS_APK_FILENAME"

          restore_current() { echo "Restoring current Worker version $CURRENT_VERSION_ID to 100%..."; npx wrangler versions deploy "$CURRENT_VERSION_ID@100%" -y; }
          trap restore_current EXIT

          # Re-add the previous version at 0% BEFORE any override requests:
          # Cloudflare only honors Cloudflare-Workers-Version-Overrides for
          # versions that are part of the active deployment. Routing stays
          # effectively unchanged (current version keeps 100%).
          npx wrangler versions deploy "$PREVIOUS_VERSION_ID@0%" "$CURRENT_VERSION_ID@100%" -y

          OVERRIDE_HEADER="Cloudflare-Workers-Version-Overrides: harvestfamily-api=\"$PREVIOUS_VERSION_ID\""
          fetch_via_previous_version() {
            # fetch_via_previous_version <label> <url> <output-file>
            local label="$1" url="$2" out="$3" status
            if ! status="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 120 --write-out '%{http_code}' -H "$OVERRIDE_HEADER" -o "$out" "$url")"; then
              echo "::error::$label failed (HTTP ${status:-unknown})"
              exit 1
            fi
            echo "$label: HTTP $status"
          }

          PREVIOUS_BODY="$(mktemp)"
          ROLLBACK_BODY="$(mktemp)"
          trap 'rm -f "$PREVIOUS_BODY" "$ROLLBACK_BODY"; restore_current' EXIT

          # Ground truth: the previous run's immutable versioned APK, served
          # from the previous Worker version's own asset manifest. Every deploy
          # replaces the static assets, so the current deployment no longer
          # hosts it - it is only reachable through the previous version.
          fetch_via_previous_version "Previous versioned APK" "$PREVIOUS_APK_URL" "$PREVIOUS_BODY"
          test -s "$PREVIOUS_BODY" || { echo "::error::Previous versioned APK body is empty"; exit 1; }
          PREVIOUS_SHA="$(sha256sum "$PREVIOUS_BODY" | cut -d' ' -f1)"
          echo "Previous verified SHA256: $PREVIOUS_SHA"

          # Rollback drill: the permanent URL, served by the previous version,
          # must resolve to exactly the same bytes as its versioned APK.
          fetch_via_previous_version "Rollback permanent URL" "$PERMANENT_URL" "$ROLLBACK_BODY"
          test -s "$ROLLBACK_BODY" || { echo "::error::Rollback permanent URL body is empty"; exit 1; }
          ROLLBACK_SHA="$(sha256sum "$ROLLBACK_BODY" | cut -d' ' -f1)"
          echo "ROLLBACK SHA256:      $ROLLBACK_SHA"

          test "$PREVIOUS_SHA" = "$ROLLBACK_SHA" || { echo "::error::Rollback APK SHA mismatch: $ROLLBACK_SHA != $PREVIOUS_SHA"; exit 1; }

          restore_current
          trap - EXIT
          rm -f "$PREVIOUS_BODY" "$ROLLBACK_BODY"
          echo "Permanent APK rollback drill passed; current Worker restored to 100%."
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: harvest-family-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup signing material
        if: always()
        run: |
          rm -f android/harvest-release.keystore android/keystore.properties
