name: Harvest Android APK Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harvest-android-release
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HARVEST_VERSION_CODE: ${{ 1000 + github.run_number }}
      HARVEST_VERSION_NAME: 1.0.${{ github.run_number }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend release checks
        run: |
          npm run lint
          npm run typecheck
          npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 is not configured"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::ANDROID_KEYSTORE_PASSWORD is not configured"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::ANDROID_KEY_ALIAS is not configured"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::ANDROID_KEY_PASSWORD is not configured"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/harvest-release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android/harvest-release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature and metadata
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          echo "APK SHA256:"
          sha256sum "$APK"
          echo "APK size:"
          stat -c '%s bytes' "$APK"

      - name: Stage APK for the permanent download URL
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk workers/downloads/harvest-family.apk
          test -s workers/downloads/harvest-family.apk

      - name: Install Worker dependencies
        run: npm ci --prefix workers

      - name: Deploy Worker and APK
        working-directory: workers
        run: npx wrangler deploy

      - name: Verify live APK
        env:
          APK_URL: https://harvestfamily-api.harvestfamily.workers.dev/harvest-family.apk
        run: |
          set -euo pipefail
          LOCAL_SHA="$(sha256sum workers/downloads/harvest-family.apk | cut -d' ' -f1)"
          LIVE_SHA="$(curl --fail --location --retry 5 --retry-delay 3 --max-time 120 "$APK_URL" | sha256sum | cut -d' ' -f1)"
          test "$LOCAL_SHA" = "$LIVE_SHA"
          echo "LIVE APK verified: $APK_URL"
          echo "SHA256: $LIVE_SHA"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: harvest-family-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup signing material
        if: always()
        run: |
          rm -f android/harvest-release.keystore android/keystore.properties
