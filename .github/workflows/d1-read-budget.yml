name: D1 read budget

# Early-warning check for the free-plan D1 row-read limit (5,000,000 rows per
# UTC day). At 100% every Worker read fails and login breaks until 00:00 UTC,
# so this alerts while there is still headroom. See docs/D1-READ-BUDGET.md.

on:
  schedule:
    # Hourly, off the hour to avoid the busiest Actions window.
    - cron: '11 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-read-budget
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install Worker dependencies
        run: npm ci --prefix workers

      # The free-plan quota is per UTC day, but `d1 info` only reports a rolling
      # 24h window. Right after midnight that window still holds yesterday, so
      # the total alone produces false alarms. Instead sample twice and alert on
      # the burn rate: a day that would read the limit if the current rate held.
      - name: Check D1 row-read burn rate
        working-directory: workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }

          read_rows() {
            local info json
            info="$(npx wrangler d1 info harvestfamily --json)"
            # wrangler can print update banners around the JSON object.
            json="$(printf '%s\n' "$info" | awk '/^\{/{on=1} on{print} /^\}/{on=0}')"
            printf '%s\n' "$json" | jq -r '.rows_read_24h // empty'
          }

          FIRST="$(read_rows)"
          test -n "$FIRST" || { echo "::error::could not read rows_read_24h from wrangler"; exit 1; }

          SAMPLE_SECONDS=300
          sleep "$SAMPLE_SECONDS"

          SECOND="$(read_rows)"
          test -n "$SECOND" || { echo "::error::could not read rows_read_24h from wrangler"; exit 1; }

          LIMIT=5000000
          WARN=3500000
          CRIT=4500000
          DELTA=$(( SECOND - FIRST ))
          [ "$DELTA" -lt 0 ] && DELTA=0
          HOURLY=$(( DELTA * 3600 / SAMPLE_SECONDS ))
          PROJECTED=$(( HOURLY * 24 ))
          PCT=$(( PROJECTED * 100 / LIMIT ))

          {
            echo "### D1 read budget"
            echo ""
            echo "| metric | value |"
            echo "| --- | --- |"
            echo "| rows read in ${SAMPLE_SECONDS}s | ${DELTA} |"
            echo "| projected rows/day | ${PROJECTED} (${PCT}% of ${LIMIT}) |"
            echo "| trailing 24h (context only) | ${SECOND} |"
            echo "| thresholds | warn ${WARN}/day, fail ${CRIT}/day |"
            echo "| UTC time | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "sample=${DELTA} rows/${SAMPLE_SECONDS}s, hourly=${HOURLY}, projected=${PROJECTED}/day, trailing24h=${SECOND}"

          if [ "$PROJECTED" -ge "$CRIT" ]; then
            echo "::error::D1 is on pace for ${PROJECTED} rows read today (${PCT}% of the free ${LIMIT}/day limit). At 100% every Worker read fails and login breaks until 00:00 UTC. Apply the mitigations in docs/D1-READ-BUDGET.md now."
            exit 1
          elif [ "$PROJECTED" -ge "$WARN" ]; then
            echo "::warning::D1 is on pace for ${PROJECTED} rows read today (${PCT}% of the free ${LIMIT}/day limit) — review docs/D1-READ-BUDGET.md before it reaches the limit."
          fi
