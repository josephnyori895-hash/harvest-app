name: D1 read budget

# Early-warning check for the free-plan D1 row-read limit (5,000,000 rows per
# UTC day). At 100% every Worker read fails and login breaks until 00:00 UTC,
# so this alerts while there is still headroom. See docs/D1-READ-BUDGET.md.

on:
  schedule:
    # Hourly, off the hour to avoid the busiest Actions window.
    - cron: '11 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-read-budget
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install Worker dependencies
        run: npm ci --prefix workers

      - name: Check trailing 24h row reads
        working-directory: workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }

          INFO="$(npx wrangler d1 info harvestfamily --json)"
          # wrangler can print update banners around the JSON object.
          JSON="$(printf '%s\n' "$INFO" | awk '/^\{/{on=1} on{print} /^\}/{on=0}')"
          ROWS="$(printf '%s\n' "$JSON" | jq -r '.rows_read_24h // empty')"
          READS="$(printf '%s\n' "$JSON" | jq -r '.read_queries_24h // empty')"
          test -n "$ROWS" || { echo "::error::could not read rows_read_24h from wrangler"; printf '%s\n' "$INFO"; exit 1; }

          LIMIT=5000000
          WARN=3500000
          CRIT=4500000
          PCT=$(( ROWS * 100 / LIMIT ))

          {
            echo "### D1 read budget"
            echo ""
            echo "| metric | value |"
            echo "| --- | --- |"
            echo "| rows read (trailing 24h) | ${ROWS} (${PCT}% of ${LIMIT}) |"
            echo "| read queries (trailing 24h) | ${READS:-unknown} |"
            echo "| thresholds | warn ${WARN}, fail ${CRIT} |"
            echo "| UTC time | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "D1 rows_read_24h=${ROWS} (${PCT}% of ${LIMIT}), read_queries_24h=${READS:-unknown}"

          if [ "$ROWS" -ge "$CRIT" ]; then
            echo "::error::D1 read budget at ${PCT}% (${ROWS} of ${LIMIT} rows in 24h). At 100% every Worker read fails and login breaks until 00:00 UTC. Apply the mitigations in docs/D1-READ-BUDGET.md now."
            exit 1
          elif [ "$ROWS" -ge "$WARN" ]; then
            echo "::warning::D1 read budget at ${PCT}% (${ROWS} of ${LIMIT} rows in 24h) — review docs/D1-READ-BUDGET.md before it reaches the limit."
          fi
