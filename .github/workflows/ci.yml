name: harvest-ci
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Typecheck (catches undefined-variable crashes before they ship)
        run: npm run typecheck
      - run: npm run test:admin
      - run: npm run test:security
      - run: npm run build
      - name: Sync Capacitor Android
        run: npx cap sync android

  workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - name: Install workers dependencies
        run: npm ci --prefix workers
      - name: Typecheck worker sources
        run: node --check workers/src/index.js && find workers/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Test media presigned upload contract
        run: npm run test:media --prefix workers
      - name: Validate wrangler config + dry-run build (no deploy)
        run: npx --prefix workers wrangler deploy --dry-run --outdir dist-check
        working-directory: workers
      - name: Validate D1 migrations parse
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3
          db="$(mktemp)"
          trap 'rm -f "$db"' EXIT
          for f in workers/migrations/*.sql; do
            echo "Applying $f"
            sqlite3 "$db" ".read $f" || exit 1
          done
