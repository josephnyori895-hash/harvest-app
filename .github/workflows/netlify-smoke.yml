name: harvest-netlify-smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Netlify production URL'
        required: true
        type: string

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ inputs.base_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Netlify smoke test
        env:
          SMOKE_BASE_URL: ${{ inputs.base_url }}
          SMOKE_USERNAME: ${{ secrets.SMOKE_USERNAME }}
          SMOKE_PIN: ${{ secrets.SMOKE_PIN }}
        run: npm run smoke:netlify
